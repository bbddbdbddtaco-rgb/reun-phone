"><span>✦ 학교 시간표</span><span>♡ 문구 쇼핑</span><span>☾ 별자리</span></div>`}</div><div class="browserbar"><button onclick="go('home')">⌂</button><button onclick="browserQuery='';browserTab='검색';render()">⌕</button><button onclick="browserTab='방문 기록';render()">◷</button></div>`}
