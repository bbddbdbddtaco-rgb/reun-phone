<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111116"><title>캐릭터의 휴대폰</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#111116;color:#111}button,input{font:inherit}button{cursor:pointer;border:0}#phone{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#fafafa}.status{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:17px;font-weight:650;position:relative;z-index:3}.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:32%;height:5px;border-radius:9px;background:currentColor;z-index:8;cursor:pointer}.screen{height:calc(100% - 55px);overflow-y:auto;padding-bottom:90px}.dark{background:linear-gradient(145deg,#303036,#101014 70%);color:white}.black{background:#000;color:white}.page{padding:18px 20px}.round{border-radius:30px;background:#f1f1f4;padding:12px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 25px}.top button,.pill{background:#f4f4f7;padding:12px 17px;border-radius:30px}.title{font-size:36px;font-weight:800;margin:15px 0 22px}.rowitem{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #e4e4e8;cursor:pointer}.avatar{width:52px;height:52px;border-radius:50%;background:#adb1c0;color:white;display:grid;place-items:center;font-size:27px;flex-shrink:0}.muted{color:#999}.small{font-size:13px}.bottomnav{position:absolute;bottom:26px;left:4%;width:92%;border-radius:32px;background:#f6f6f8;display:flex;justify-content:space-around;padding:13px 5px;z-index:5}.bottomnav button{background:none;font-size:13px}.lockcenter{text-align:center;padding-top:45px}.clockbig{font-size:clamp(65px,19vw,105px);font-weight:650;letter-spacing:-5px}.lockbottom{position:absolute;bottom:65px;width:100%;display:flex;justify-content:space-around;align-items:center}.lockbottom button{border-radius:50%;width:54px;height:54px;background:#424248;color:white;font-size:24px}.pin{display:grid;grid-template-columns:repeat(3,74px);gap:19px;justify-content:center;margin-top:60px}.pin button{height:74px;border-radius:50%;background:#3c3c41;color:white;font-size:32px}.dots{text-align:center;font-size:28px;letter-spacing:15px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 9px;margin-top:25px}.app{text-align:center;color:white;font-size:12px;background:none;padding:0}.ico{width:min(16vw,65px);height:min(16vw,65px);border-radius:16px;margin:0 auto 7px;display:grid;place-items:center;font-size:32px;background:white;color:#111}.widget{padding:20px;border-radius:25px;background:#ffffff30;margin:20px 0 35px}.dock{position:absolute;bottom:45px;left:4%;width:92%;display:flex;justify-content:space-around;padding:15px 5px;border-radius:28px;background:#ffffff30}.dock .ico{margin:0}.search{width:100%;background:#eeeef0;border:0;border-radius:25px;padding:15px;margin-bottom:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:10px 0}.calendar button{height:43px;background:none}.calendar .selected{background:#ff3b30;color:white;border-radius:50%}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.photos button{aspect-ratio:1;background:linear-gradient(130deg,#9ac6ba,#bb8da5);font-size:35px}.bubble{padding:12px 15px;border-radius:19px;background:#e9e9ee;margin:9px 0;max-width:80%;width:fit-content}.bubble.me{background:#36c95c;color:white;margin-left:auto}.back{background:none;color:#1685ff;font-size:19px;padding:0}.floating{position:absolute;bottom:38px;right:20px;border-radius:30px;padding:14px;background:#f4f4f7}.alarm{display:flex;justify-content:space-between;border-bottom:1px solid #555;padding:25px 0}.toggle{width:55px;height:32px;border-radius:20px;background:#34c759;color:white}.camera{height:100%;display:flex;flex-direction:column;justify-content:space-between}.shutter{width:76px;height:76px;border-radius:50%;background:white;border:5px solid #aaa;margin:0 auto 40px}.call{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:85%;padding:60px 10px}.call button{padding:20px 30px;border-radius:40px;background:#dedede55;color:white}a{color:inherit}

const config={owner:'른',pin:'0511',contacts:[{name:'왼',text:'른아 나 보고 싶었어? ㅋㅋ',time:'12:01'},{name:'엄마',text:'저녁 먹고 들어와~',time:'11:20'},{name:'반장',text:'내일 수행평가 자료 챙겨!',time:'어제'},{name:'담임 선생님',text:'내일은 체육복 준비하세요.',time:'어제'}],notes:[{title:'해야 할 일',body:'□ 영어 수행평가 준비\n□ 수학 숙제\n□ 왼한테 빌린 펜 돌려주기\n□ 아니 그냥 내일 줘도 됨'},{title:'절대 하지 말 것',body:'1. 왼이랑 같이 하교하지 않기\n2. 왼이 하는 말에 반응하지 않기\n3. 웃지 않기\n\n근데 오늘은 왜 안 왔는데????'},{title:'생일 선물',body:'그냥 친구 생일이라서 찾아본 거임.\n검정 후드? 키링?\n너무 비싸면 이상하잖아.\n아 짜증나.'},{title:'비밀',body:'걔가 다른 애한테 웃어주는 거 보니까 기분이 나빴다.\n진짜 왜????'}],events:{18:['영어 단어 시험','왼이랑 하교? (취소 안 함)'],19:['수학 수행평가'],21:['체육대회 연습'],24:['왼 생일 선물 알아보기']}};

let view='lock',pin='',previous='home',detail=0,month=new Date().getMonth(),year=new Date().getFullYear(),day=new Date().getDate(),filter='',cameraMode='사진',alarm=true;const root=document.getElementById('phone');const pad=n=>String(n).padStart(2,'0');const now=()=>new Date();const time=()=>`${pad(now().getHours())}:${pad(now().getMinutes())}`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(v){if(['lock','pin'].includes(view)&&!['lock','pin'].includes(v)&&!(view==='pin'&&v==='home'&&pin===config.pin))return;previous=view;view=v;filter='';render()}function status(){return `<div class="status"><span>${time()}</span><span>▂▄▆  ◉  ▰</span></div>`}function nav(items){return `<div class="bottomnav">${items.map(([a,b])=>`<button onclick="go('${b}')">${a}</button>`).join('')}</div>`}function header(t){return `<div class="top"><button onclick="go('home')">‹ 뒤로</button><b>${t}</b><button onclick="go('home')">⌂</button></div>`}function items(arr,action){return arr.filter(x=>(x.name||x.title||'').includes(filter)).map((x,i)=>`<div class="rowitem" onclick="${action}(${i})"><div class="avatar">●</div><div style="flex:1;min-width:0"><b>${esc(x.name||x.title)}</b><div class="muted small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.text||x.body||'')}</div></div><span class="muted small">${esc(x.time||'')}</span></div>`).join('')};function openDetail(i,v){detail=i;go(v)}function searchInput(){return `<input class="search" placeholder="검색" value="${esc(filter)}" oninput="filter=this.value;document.querySelector('.results').innerHTML=window.makeResults()">`};window.makeResults=()=>items(config.contacts,'openChat');function openChat(i){openDetail(i,'chat')};function render(){let dark=['lock','pin','home','camera','alarm','incoming'].includes(view),black=['camera','alarm'].includes(view);let html='';if(view==='lock'){html=`<div class="lockcenter"><div>🔒</div><h3>${now().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}</h3><div class="clockbig">${time()}</div></div><div class="lockbottom"><button onclick="go('camera')">ϟ</button><span onclick="go('pin')">위로 쓸어올려 열기 ↑</span><button onclick="go('camera')">▣</button></div>`}if(view==='pin'){html=`<div class="lockcenter"><h2>암호 입력</h2><div class="dots">${'●'.repeat(pin.length)}${'○'.repeat(4-pin.length)}</div></div><div class="pin">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>n===''?'<span></span>':`<button onclick="pressPin('${n}')">${n}</button>`).join('')}</div><div class="lockbottom"><span>긴급 상황</span><span onclick="go('lock')">취소</span></div>`}if(view==='home'){const apps=[['✉️','메일','mail','#0878ed'],['📅','캘린더','calendar','#fff'],['🕒','시계','alarm','#fff'],['🌤','날씨','weather','#69b7ed'],['📝','메모','notes','#ffcf3e'],['🏞','사진','photos','#fff'],['📷','카메라','camera','#aaa']];html=`<div class="page"><div class="widget" onclick="go('calendar')"><b>${now().toLocaleDateString('ko-KR',{weekday:'long'})} ${day}일</b><p>📅 ${config.events[day]?.join(' · ')||'수업 · 숙제 · 하교'}</p></div><div class="apps">${apps.map(([ic,n,v,c])=>`<button class="app" onclick="go('${v}')"><div class="ico" style="background:${c}">${doodleIcon(v)}</div>${n}</button>`).join('')}</div></div><div class="dock">${[['☎','calls','#2ed05a'],['🌐','browser','#fff'],['💬','messages','#2ed05a'],['●','kakao','#ffdf00']].map(([ic,v,c])=>`<button class="app" onclick="go('${v}')"><div class="ico" style="background:${c}">${doodleIcon(v)}</div></button>`).join('')}</div>`}if(view==='calls'){html=`<div class="page"><div class="top"><button>편집</button><b>모두　 부재중 전화</b><button onclick="go('contacts')">☰</button></div><div class="title">최근 통화</div>${searchInput()}<div class="results">${items(config.contacts,'openIncoming')}</div></div>${nav([['★','calls'],['◷','calls'],['연락처','contacts'],['▦','keypad']])}`}if(view==='contacts'){html=`<div class="page">${header('연락처')}<h1>연락처</h1>${items(config.contacts,'openIncoming')}</div>`}if(view==='keypad'){html=`<div class="page">${header('키패드')}<div class="pin">${[1,2,3,4,5,6,7,8,9,'',0,'☎'].map(n=>`<button>${n}</button>`).join('')}</div></div>`}if(view==='incoming'){html=`<div class="call"><div style="text-align:center"><div style="font-size:32px">${esc(config.contacts[detail].name)}</div><p>휴대전화</p></div><div style="display:flex;gap:30px"><button onclick="go('calls')">◷ 나중에 보기</button><button onclick="go('chat')">💬 메시지</button></div><button style="background:#32c75a" onclick="go('connected')">☎ 밀어서 통화하기 →</button></div>`}if(view==='connected'){html=`<div class="call"><h1>${esc(config.contacts[detail].name)}</h1><p>통화 중 (시뮬레이션)</p><button onclick="go('calls')">🔴 통화 종료</button></div>`}if(view==='messages'||view==='kakao'||view==='mail'){html=`<div class="page"><div class="top"><button onclick="go('home')">‹</button><b>${view==='kakao'?'채팅':view==='mail'?'메일':'메시지'}</b><button>☰</button></div><h1 class="title">${view==='kakao'?'채팅':view==='mail'?'받은 편지함':'메시지'}</h1>${searchInput()}<div class="results">${items(config.contacts,'openChat')}</div></div>${view==='kakao'?nav([['친구','contacts'],['채팅','kakao'],['더보기','home']]):''}`}if(view==='chat'){let x=config.contacts[detail];html=`<div class="page">${header(esc(x.name))}<div style="padding-top:35px"><div class="bubble">${esc(x.text)}</div><div class="bubble me">야 아 변태야!!!!!!</div><div class="bubble">ㅋㅋㅋㅋ 알았어, 그럼 안 갈게?</div><div class="bubble me">너 어딨는데 왜 안와!!!!</div><div class="bubble">나 보고 싶었구나 ♡</div><div class="bubble me">몰라 짜증나!!!</div></div></div><div style="position:absolute;bottom:30px;left:4%;width:92%;display:flex;gap:8px"><input class="search" id="msg" placeholder="메시지 입력" style="margin:0"><button onclick="sendMsg()">↑</button></div>`}if(view==='calendar'){let first=new Date(year,month,1).getDay(),len=new Date(year,month+1,0).getDate();html=`<div class="page">${header('캘린더')}<div class="top"><h1>${year}년 ${month+1}월</h1><span><button onclick="changeMonth(-1)">‹</button> <button onclick="changeMonth(1)">›</button></span></div><div class="calendar">${['일','월','화','수','목','금','토'].map(s=>`<b>${s}</b>`).join('')}${Array(first).fill('<span></span>').join('')}${Array.from({length:len},(_,i)=>`<button class="${day===i+1?'selected':''}" onclick="day=${i+1};render()">${i+1}${config.events[i+1]?' •':''}</button>`).join('')}</div><hr><h3>${month+1}월 ${day}일</h3>${(config.events[day]||['일정 없음']).map(s=>`<p>🟢 ${esc(s)}</p>`).join('')}</div>`}if(view==='notes'){html=`<div class="page" style="background:#f2f2f8;min-height:100%">${header('메모')}<h1 class="title">모든 iCloud</h1><p class="muted">${config.notes.length}개의 메모</p>${config.notes.map((n,i)=>`<div class="round" style="background:white;margin:12px 0" onclick="openDetail(${i},'note')"><b>${esc(n.title)}</b><p class="muted">${esc(n.body).slice(0,70)}</p></div>`).join('')}</div>`}if(view==='note'){html=`<div class="page">${header('메모')}<h2>${esc(config.notes[detail].title)}</h2><p style="white-space:pre-line;line-height:2">${esc(config.notes[detail].body)}</p></div>`}if(view==='photos'){html=`<div style="padding:15px"><div class="top"><h1>보관함</h1><button>선택</button></div><p class="muted">른의 사진 보관함 · 소꿉친구와 학교생활</p></div><div class="photos">${galleryPhotos.map((src,i)=>`<button aria-label="사진 ${i+1} 보기" style="background:#eee url('${src}') center/cover" onclick="openDetail(${i},'photo')"></button>`).join('')}</div>${nav([['▣ 보관함','photos'],['▦ 모음','photos'],['⌕ 검색','photos']])}`}if(view==='photo'){html=`<div class="page">${header('사진')}<img src="${galleryPhotos[detail]}" style="width:100%;max-height:70vh;object-fit:contain;background:#eee"><p class="muted">${detail+1} / ${galleryPhotos.length} · 른의 일상</p></div>`}if(view==='camera'){html=`<div class="camera"><div class="top" style="padding:20px"><button>ϟ</button><b>⌃</b><button>◎</button></div><div style="background:#111;flex:1"></div><div style="text-align:center;padding:20px"><p>시네마틱　동영상　 <b style="color:#ffdd00">${cameraMode}</b>　인물 사진</p><button class="shutter" onclick="alert('웹사이트 미리보기용 카메라입니다.')"></button></div></div>`}if(view==='alarm'){html=`<div class="page">${header('시계')}<h1 class="title">알람</h1><p>🛏 수면 | 기상</p><hr><h2 class="muted">알람 없음</h2><div class="alarm"><div><span style="font-size:45px">06:30</span><p>기상 · 주중</p></div><button class="toggle" style="background:${alarm?'#34c759':'#555'}" onclick="alarm=!alarm;render()">${alarm?'●':'○'}</button></div></div>${nav([['세계 시계','alarm'],['⏰ 알람','alarm'],['스톱워치','alarm'],['타이머','alarm']])}`}if(view==='browser'){let results=browserQuery.trim();html=`<div class="page browser-page">${header('Safari')}<div class="top"><h1 class="title">${results?'검색 결과':'검색'}</h1><button onclick="browserTab=browserTab==='방문 기록'?'검색':'방문 기록';render()">${browserTab==='방문 기록'?'검색':'◷ 기록'}</button></div><form onsubmit="searchBrowser(event)"><input id="browserInput" class="search" placeholder="검색어 또는 URL 입력" value="${esc(browserQuery)}"><button class="round" style="margin-bottom:16px">검색 ↗</button></form>${browserTab==='방문 기록'?`<h2>방문 기록</h2><p class="muted small">른이 최근에 검색한 내용</p>${browserHistory.map((q,i)=>`<div class="historyitem"><button onclick="runBrowser(${i})"><span>◷</span> ${esc(q)}</button></div>`).join('')}<button class="round" onclick="clearBrowserHistory()">방문 기록 지우기</button>`:results?`<p class="muted">'${esc(browserQuery)}' 검색 결과 · 가상 웹페이지</p><div class="resultcard"><span class="small muted">상담 · 학교생활</span><h3>${esc(browserQuery)}</h3><p>${esc(searchExplanations[history.indexOf(browserQuery)]||'친구 관계에서는 서로의 마음과 경계를 존중하는 것이 중요합니다. 너무 서두르지 않아도 괜찮아요.')}</p></div><div class="resultcard"><span class="small muted">Q&A · 인간관계</span><h3>비슷한 고민을 하는 사람들</h3><p>답은 사람마다 다를 수 있어요. 상대의 행동과 자신의 감정을 함께 생각해 보세요.</p></div><button class="round" onclick="browserQuery='';render()">검색 화면으로</button>`:`<h3>최근 검색</h3>${browserHistory.slice(0,6).map((q,i)=>`<div class="historyitem"><button onclick="runBrowser(${i})"><span>⌕</span> ${esc(q)}</button></div>`).join('')}<h3 style="margin-top:28px">즐겨찾기</h3><div class="favrow"><span>✦ 학교 시간표</span><span>♡ 문구 쇼핑</span><span>☾ 별자리</span></div>`}</div><div class="browserbar"><button onclick="go('home')">⌂</button><button onclick="browserQuery='';browserTab='검색';render()">⌕</button><button onclick="browserTab='방문 기록';render()">◷</button></div>`}
if(view==='weather'){html=`<div class="page">${header('날씨')}<h1>☀️ 맑음</h1><p>날씨 화면은 캐릭터 설정에 맞춰 변경할 수 있어요.</p></div>`}root.className=view==='lock'?'dark wallpaper-lock':view==='pin'?'dark wallpaper-pin':view==='home'?'dark wallpaper-home':dark?'dark':black?'black':'';root.innerHTML=status()+`<main class="screen">${html}</main><div class="homebar" onclick="${['lock','pin'].includes(view)?'':"go('home')"}"></div>`;if(view==='lock'){let start;root.querySelector('.screen').addEventListener('touchstart',e=>start=e.touches[0].clientY,{passive:true});root.querySelector('.screen').addEventListener('touchend',e=>{if(start-e.changedTouches[0].clientY>40)go('pin')},{passive:true})}}function searchBrowser(e){e.preventDefault();browserQuery=document.getElementById('browserInput').value.trim();if(browserQuery&&!browserHistory.includes(browserQuery))browserHistory.unshift(browserQuery);browserTab='검색';render()}function runBrowser(i){browserQuery=browserHistory[i];browserTab='검색';render()}function clearBrowserHistory(){if(confirm('방문 기록을 삭제할까요?')){browserHistory=[];browserQuery='';render()}}function pressPin(n){if(n==='⌫')pin=pin.slice(0,-1);else pin+=n;if(pin.length===4){if(pin===config.pin){go('home');pin=''}else{pin='';alert('암호가 올바르지 않습니다.')}}else render()}function changeMonth(d){month+=d;if(month<0){month=11;year--}if(month>11){month=0;year++}day=1;render()}function sendMsg(){let el=document.getElementById('msg');if(!el.value.trim())return;let b=document.createElement('div');b.className='bubble me';b.textContent=el.value;document.querySelector('.page>div:nth-child(2)').appendChild(b);el.value=''}render();setInterval(()=>{let t=root.querySelector('.status span');if(t)t.textContent=time()},15000);
</script></body></html>
