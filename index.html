기록" onclick="browserTab='방문 기록';render()"><span class="tab-count">${browserHistory.length}</span></button><button aria-label="더보기" onclick="browserTab=browserTab==='방문 기록'?'검색':'방문 기록';render()">${iosIcon('dots')}</button></nav>`}

if(view==='contactcard'){const x=config.contacts[detail];html=`<div class="ios-page contact-card"><button class="back" onclick="go('calls')">‹ 최근 통화</button><span class="ios-avatar"></span><h1>${esc(x.name)}</h1><div class="contact-actions"><button onclick="go('chat')">${iosIcon('chat')}메시지</button><button onclick="go('incoming')">☎<br>통화</button></div><p>휴대전화</p></div>`}
